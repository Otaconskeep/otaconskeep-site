<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05080d"/><stop offset="1" stop-color="#0a111a"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#142131"/><stop offset="1" stop-color="#0b121b"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#182331" stroke-width="1" opacity="0.55"/></pattern>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<rect width="100%" height="100%" fill="url(#grid)" opacity="0.65"/>
<text x="90" y="90" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#8ea1b5" text-anchor="start" opacity="1">HOMELAB ACADEMY</text><text x="90" y="155" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="900" fill="#e8f3ff" text-anchor="start" opacity="1">HOW THE PIECES FIT TOGETHER</text><rect x="230" y="260" width="1140" height="58" rx="16" fill="url(#glass)" stroke="#ff6b7a" stroke-width="2" opacity="1"/><text x="800" y="298" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#e8f3ff" text-anchor="middle" opacity="1">USER / AUTOMATION</text><rect x="230" y="336" width="1140" height="58" rx="16" fill="url(#glass)" stroke="#51e6c1" stroke-width="2" opacity="1"/><text x="800" y="374" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#e8f3ff" text-anchor="middle" opacity="1">HOME ASSISTANT • ARR • n8n • VOICE</text><rect x="230" y="412" width="1140" height="58" rx="16" fill="url(#glass)" stroke="#56d6ff" stroke-width="2" opacity="1"/><text x="800" y="450" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#e8f3ff" text-anchor="middle" opacity="1">CONTAINERS / DOCKER</text><rect x="230" y="488" width="1140" height="58" rx="16" fill="url(#glass)" stroke="#83e377" stroke-width="2" opacity="1"/><text x="800" y="526" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#e8f3ff" text-anchor="middle" opacity="1">LINUX SERVICES + FILESYSTEM</text><rect x="230" y="564" width="1140" height="58" rx="16" fill="url(#glass)" stroke="#6aa8ff" stroke-width="2" opacity="1"/><text x="800" y="602" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#e8f3ff" text-anchor="middle" opacity="1">NETWORKING • DNS • ROUTING • FIREWALL</text><rect x="230" y="640" width="1140" height="58" rx="16" fill="url(#glass)" stroke="#b28cff" stroke-width="2" opacity="1"/><text x="800" y="678" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#e8f3ff" text-anchor="middle" opacity="1">HYPERVISOR / VIRTUAL MACHINE</text><rect x="230" y="716" width="1140" height="58" rx="16" fill="url(#glass)" stroke="#ffc857" stroke-width="2" opacity="1"/><text x="800" y="754" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#e8f3ff" text-anchor="middle" opacity="1">HARDWARE • CPU • RAM • DISK • NIC</text><text x="800" y="840" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#8ea1b5" text-anchor="middle" opacity="1">Most “app problems” become easier when you identify the layer first.</text></svg>