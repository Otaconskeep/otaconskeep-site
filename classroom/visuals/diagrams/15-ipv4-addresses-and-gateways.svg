<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05080d"/><stop offset="1" stop-color="#0a111a"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#142131"/><stop offset="1" stop-color="#0b121b"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#182331" stroke-width="1" opacity="0.55"/></pattern>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<rect width="100%" height="100%" fill="url(#grid)" opacity="0.65"/>
<text x="90" y="74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#8ea1b5" text-anchor="start" opacity="1">OTACONSKEEP // HOMELAB ACADEMY</text><text x="90" y="132" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="#56d6ff" text-anchor="start" opacity="1">CLASS 15</text><text x="90" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="800" fill="#e8f3ff" text-anchor="start" opacity="1">IPv4 addresses and gateways</text><rect x="90" y="254" width="250" height="46" rx="23" fill="#0d151e" stroke="#56d6ff" stroke-width="1.5" opacity="1"/><text x="215" y="285" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#56d6ff" text-anchor="middle" opacity="1">INFRASTRUCTURE</text><text x="1510" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#8ea1b5" text-anchor="end" opacity="1">VISUAL REFERENCE</text><rect x="140.0" y="500" width="312.0" height="180" rx="18" fill="url(#glass)" stroke="#56d6ff" stroke-width="2" opacity="1" filter="url(#shadow)"/><text x="160.0" y="542" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#56d6ff" text-anchor="start" opacity="1">NETWORK</text><text x="160.0" y="600" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#e8f3ff" text-anchor="start" opacity="1">192.168.50.0/24</text><text x="160.0" y="642" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#8ea1b5" text-anchor="start" opacity="1">identifies subnet</text><rect x="470.0" y="500" width="312.0" height="180" rx="18" fill="url(#glass)" stroke="#2c3d50" stroke-width="2" opacity="1" filter="url(#shadow)"/><text x="490.0" y="542" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#56d6ff" text-anchor="start" opacity="1">HOST</text><text x="490.0" y="600" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#e8f3ff" text-anchor="start" opacity="1">Host .42</text><text x="490.0" y="642" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#8ea1b5" text-anchor="start" opacity="1">one usable device</text><rect x="800.0" y="500" width="312.0" height="180" rx="18" fill="url(#glass)" stroke="#56d6ff" stroke-width="2" opacity="1" filter="url(#shadow)"/><text x="820.0" y="542" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#56d6ff" text-anchor="start" opacity="1">GATEWAY</text><text x="820.0" y="600" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#e8f3ff" text-anchor="start" opacity="1">Gateway .1</text><text x="820.0" y="642" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#8ea1b5" text-anchor="start" opacity="1">next hop off subnet</text><rect x="1130.0" y="500" width="312.0" height="180" rx="18" fill="url(#glass)" stroke="#2c3d50" stroke-width="2" opacity="1" filter="url(#shadow)"/><text x="1150.0" y="542" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#56d6ff" text-anchor="start" opacity="1">BROADCAST</text><text x="1150.0" y="600" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800" fill="#e8f3ff" text-anchor="start" opacity="1">Broadcast .255</text><text x="1150.0" y="642" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#8ea1b5" text-anchor="start" opacity="1">not assignable</text><line x1="140" y1="740" x2="1442.0" y2="740.0" stroke="#56d6ff" stroke-width="5" stroke-linecap="round"/><polygon points="1460,740 1448.2,747.5 1448.2,732.5" fill="#56d6ff"/><text x="800" y="790" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#8ea1b5" text-anchor="middle" opacity="1">Mask decides which addresses are local; gateway handles everything else.</text><text x="90" y="855" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#8ea1b5" text-anchor="start" opacity="1">Use as a concept map: then prove it in the lab.</text><text x="1510" y="855" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#8ea1b5" text-anchor="end" opacity="1">otaconskeep.github.io/classroom</text></svg>