<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05080d"/><stop offset="1" stop-color="#0a111a"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#142131"/><stop offset="1" stop-color="#0b121b"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#182331" stroke-width="1" opacity="0.55"/></pattern>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<rect width="100%" height="100%" fill="url(#grid)" opacity="0.65"/>
<text x="90" y="74" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#8ea1b5" text-anchor="start" opacity="1">OTACONSKEEP // HOMELAB ACADEMY</text><text x="90" y="132" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="#6aa8ff" text-anchor="start" opacity="1">CLASS 26</text><text x="90" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="800" fill="#e8f3ff" text-anchor="start" opacity="1">Network Troubleshooting Tools and</text><text x="90" y="246" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="800" fill="#e8f3ff" text-anchor="start" opacity="1">Methodology</text><rect x="90" y="310" width="250" height="46" rx="23" fill="#0d151e" stroke="#6aa8ff" stroke-width="1.5" opacity="1"/><text x="215" y="341" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#6aa8ff" text-anchor="middle" opacity="1">NETWORK</text><text x="1510" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#8ea1b5" text-anchor="end" opacity="1">VISUAL REFERENCE</text><rect x="330.0" y="420" width="940" height="50" rx="12" fill="#0d151e" stroke="#6aa8ff" stroke-width="1.8" opacity="1"/><text x="800" y="453" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#e8f3ff" text-anchor="middle" opacity="1">1. Link</text><rect x="390.0" y="480" width="820" height="50" rx="12" fill="#0d151e" stroke="#314354" stroke-width="1.8" opacity="1"/><text x="800" y="513" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#e8f3ff" text-anchor="middle" opacity="1">2. IP address</text><rect x="450.0" y="540" width="700" height="50" rx="12" fill="#0d151e" stroke="#314354" stroke-width="1.8" opacity="1"/><text x="800" y="573" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#e8f3ff" text-anchor="middle" opacity="1">3. Gateway</text><rect x="510.0" y="600" width="580" height="50" rx="12" fill="#0d151e" stroke="#314354" stroke-width="1.8" opacity="1"/><text x="800" y="633" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#e8f3ff" text-anchor="middle" opacity="1">4. DNS</text><rect x="570.0" y="660" width="460" height="50" rx="12" fill="#0d151e" stroke="#314354" stroke-width="1.8" opacity="1"/><text x="800" y="693" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#e8f3ff" text-anchor="middle" opacity="1">5. Port</text><rect x="630.0" y="720" width="340" height="50" rx="12" fill="#0d151e" stroke="#314354" stroke-width="1.8" opacity="1"/><text x="800" y="753" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#e8f3ff" text-anchor="middle" opacity="1">6. Application</text><text x="800" y="810" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#8ea1b5" text-anchor="middle" opacity="1">Start low. Do not debug DNS before you know the link and IP are good.</text><text x="90" y="855" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#8ea1b5" text-anchor="start" opacity="1">Use as a concept map: then prove it in the lab.</text><text x="1510" y="855" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500" fill="#8ea1b5" text-anchor="end" opacity="1">otaconskeep.github.io/classroom</text></svg>