name: Deploy Cloudflare Workers/Pages

# Production deploy ONLY after merge to main.
# Do NOT use this workflow as a required pull_request check.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: cloudflare-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publish Worker (static assets)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.34.0"
          command: deploy
